apiVersion: 1
policies:
    - orgId: 1
      receiver: grafana-default-email
      group_by:
        - grafana_folder
        - alertname
      routes:
        - receiver: discord
          object_matchers:
            - - grafana_folder
              - =
              - Trungscendence
          group_wait: 1s
          group_interval: 1s
