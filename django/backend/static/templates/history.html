<div class="history">
	{% load static %}
	<h1>Game History</h1>
	<div class="scoreboard">
		<table id="scoreboard-table" style="border: 1px solid black; border-collapse: collapse">
			<tr>
				<th>Match ID</th>
				<th>Date</th>
				<th>Player 1</th>
				<th>Player 2</th>
				<th>Score P1</th>
				<th>Score P2</th>
				<th>Winner</th>
			</tr>
			{% for match in matches %}
				<tr>
					<td>{{ match.match_id }}</td>
					<td>{{ match.date }}</td>
					<td>{{ match.player_1 }}</td>
					<td>{{ match.player_2 }}</td>
					<td>{{ match.score_1 }}</td>
					<td>{{ match.score_2 }}</td>
					<td>{{ match.winner }}</td>
				</tr>
			{% endfor %}
		</table>
	</div>
</div>
