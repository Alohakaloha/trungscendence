<h2 style="text-align: center;">TOURNAMENT RULES</h2>
<div class="game-option-settings">

	<form>
		<div id="inline-options">
			<h5 class="input-description">SCORE TO WIN</h5>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score1" value="2">
				<label class="form-check-label" for="score1">2</label>
			</div>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score2" value="3" checked>
				<label class="form-check-label" for="score2">3</label>
			</div>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score3" value="4">
				<label class="form-check-label" for="score3">4</label>
			</div>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score4" value="5">
				<label class="form-check-label" for="score4">5</label>
			</div>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score5" value="6">
				<label class="form-check-label" for="score5">6</label>
			</div>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score6" value="7">
				<label class="form-check-label" for="score6">7</label>
			</div>
			<div class="form-check form-check-inline">
				<input class="form-check-input" type="radio" name="score" id="score7" value="8">
				<label class="form-check-label" for="score7">8</label>
			</div>
		</div>
		<h5 class="input-description">ROUNDS TO WIN</h5>
		<div class="form-check form-check-inline" >
		<input class="form-check-input" type="radio" name="roundsToWin" id="roundsToWin1" value="1" checked>
		<label class="form-check-label" for="roundsToWin1">1</label>
	</div>
	<div class="form-check form-check-inline">
		<input class="form-check-input" type="radio" name="roundsToWin" id="roundsToWin2" value="2">
		<label class="form-check-label" for="roundsToWin2">2</label>
	</div>
	<div class="form-check form-check-inline">
		<input class="form-check-input" type="radio" name="roundsToWin" id="roundsToWin3" value="3">
		<label class="form-check-label" for="roundsToWin3">3</label>
	</div>
</form>
<button type="button" onclick="enterLocalTournament()" class="btn btn-dark" style="margin-top: 10px;">Let's Play!</button>
</div>
